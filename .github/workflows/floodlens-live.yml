name: FloodLens Live Lokoja Analysis
# Keep the live evidence dataset synchronized with production.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "scripts/run_lokoja_live.py"
      - ".github/workflows/floodlens-live.yml"

jobs:
  live-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: pytest -q

      - name: Run real Sentinel-1 + OSM analysis
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          PYTHONPATH=. python scripts/run_lokoja_live.py

      - name: Persist live dataset for the web demo
        run: |
          mkdir -p public/data/lokoja-2022
          cp artifacts/lokoja-2022/summary.json public/data/lokoja-2022/
          cp artifacts/lokoja-2022/flood_candidate_cleaned.geojson public/data/lokoja-2022/
          cp artifacts/lokoja-2022/affected_roads.geojson public/data/lokoja-2022/
          cp artifacts/lokoja-2022/bridges.geojson public/data/lokoja-2022/
          cp artifacts/lokoja-2022/communities.geojson public/data/lokoja-2022/
          cp artifacts/lokoja-2022/sentinel_before_vv.png public/data/lokoja-2022/
          cp artifacts/lokoja-2022/sentinel_after_vv.png public/data/lokoja-2022/
          cp artifacts/lokoja-2022/sentinel_vv_change.png public/data/lokoja-2022/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/lokoja-2022
          if git diff --cached --quiet; then
            echo "No live dataset changes to commit."
          else
            git commit -m "data: update Lokoja 2022 live analysis"
            git push
          fi

      - name: Upload FloodLens artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floodlens-lokoja-2022
          path: artifacts/lokoja-2022/
          if-no-files-found: error
